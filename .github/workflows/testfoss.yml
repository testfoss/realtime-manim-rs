name: testfoss-demo

on:
  push:
    branches: [testfoss-demo]
  pull_request:
  workflow_dispatch:
    inputs:
      webgpu_browser:
        description: Run the hardware-dependent rendered WebGPU check
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testfoss-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Build package and run 35 package tests
        run: ./testfoss/run.sh package

  webgpu-browser:
    if: github.event_name == 'workflow_dispatch' && inputs.webgpu_browser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Build package and run package tests
        run: ./testfoss/run.sh package
      - name: Install Chromium and headful display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          cd testfoss
          npx playwright install --with-deps chromium
      - name: Check pause, exact 2s seek, and resume through lmwebtest
        run: xvfb-run --auto-servernum env LMCODE_HEADED=1 ./testfoss/run.sh browser
